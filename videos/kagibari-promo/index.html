<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FDFAF4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="29"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-expiry"
        class="scene"
        data-composition-id="03-expiry"
        data-composition-src="compositions/frames/03-expiry.html"
        data-start="9"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-auto"
        class="scene"
        data-composition-id="04-auto"
        data-composition-src="compositions/frames/04-auto.html"
        data-start="14"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-value"
        class="scene"
        data-composition-id="05-value"
        data-composition-src="compositions/frames/05-value.html"
        data-start="19"
        data-duration="5.9"
        data-track-index="0"
      ></div>

      <div
        id="el-06-outro"
        class="scene"
        data-composition-id="06-outro"
        data-composition-src="compositions/frames/06-outro.html"
        data-start="24.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4);
        tl.fromTo("#el-02-intro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4);
        tl.to("#el-02-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-expiry", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9);
        tl.to("#el-03-expiry", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 14);
        tl.fromTo("#el-04-auto", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 14);
        tl.to("#el-04-auto", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.fromTo("#el-05-value", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.to("#el-05-value", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 24.5);
        tl.fromTo("#el-06-outro", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 24.5);
        tl.to({}, { duration: 29 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
