    <div class="clip f06-outro-stage" data-start="0" data-duration="4.5" data-track-index="1">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        // Every visible on-screen string lives here (en/zh variants swap this object).
        const STRINGS = {
          topbarLabel: "KAGIBARI — CROCHET CHART",
          topbarCounter: "06",
          wordmark: "钩针编织图设计",
          cta: "免费试用",
          stores: "Google Play",
        };

        // ── inject strings into the DOM ──
        document.getElementById("f06-outro-topbar-label").textContent =
          STRINGS.topbarLabel;
        document.getElementById("f06-outro-topbar-counter").textContent =
          STRINGS.topbarCounter;
        document.getElementById("f06-outro-cta").textContent = STRINGS.cta;
        document.getElementById("f06-outro-stores").textContent = STRINGS.stores;

        // Wordmark: per-word units when the string has spaces (latin variants),
        // per-character units otherwise (CJK) — for the staggered reveal.
        const wordmarkEl = document.getElementById("f06-outro-wordmark");
        const spaced = STRINGS.wordmark.includes(" ");
        const units = spaced
          ? STRINGS.wordmark.split(" ")
          : Array.from(STRINGS.wordmark);
        units.forEach(function (unit, i) {
          const span = document.createElement("span");
          span.textContent = unit;
          if (spaced && i < units.length - 1) span.style.marginRight = "0.28em";
          wordmarkEl.appendChild(span);
        });
        const wordSpans = Array.from(wordmarkEl.children);

        // ── one paused timeline, built synchronously ──
        const DIM = "#5C6E69"; // fade-through tone on the dark green ground
        const CREAM = "#FDFAF4";
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.4s): ambient glow blooms once while the icon
        // spring-pops from zero — glow peak and icon settle land as ONE beat.
        tl.fromTo(
          "#f06-outro-glow",
          { opacity: 0, scale: 0.82 },
          { opacity: 0.3, scale: 1.05, duration: 0.95, ease: "power2.out" },
          0.0
        );
        // one breath past peak, then eases to its resting state — static after 1.6s
        tl.to(
          "#f06-outro-glow",
          { opacity: 0.24, scale: 1.0, duration: 0.55, ease: "power2.inOut" },
          1.05
        );

        // hero icon — spring-pop entrance, smooth long-tail settle, NO overshoot
        tl.fromTo(
          "#f06-outro-icon",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.9, ease: "power3.out" },
          0.05
        );

        // quiet chrome fade-in
        tl.fromTo(
          "#f06-outro-topbar",
          { opacity: 0 },
          { opacity: 1, duration: 0.5, ease: "power2.out" },
          0.3
        );

        // Scene 2 (1.4–2.6s): wordmark — per-unit staggered reveal,
        // fade-through-grey (opacity + color) with a small rise.
        wordSpans.forEach(function (span, i) {
          tl.fromTo(
            span,
            { opacity: 0, y: 26, color: DIM },
            {
              opacity: 1,
              y: 0,
              color: CREAM,
              duration: 0.6,
              ease: "power3.out",
            },
            1.45 + i * 0.11
          );
        });

        // Scene 3 (2.6–3.6s): accent rule, CTA line, then the mono store line
        // land in sequence.
        tl.fromTo(
          "#f06-outro-rule",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.45, ease: "power3.out" },
          2.62
        );
        tl.fromTo(
          "#f06-outro-cta",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          2.72
        );
        tl.fromTo(
          "#f06-outro-stores",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          3.05
        );

        // Scene 4 (3.6–4.5s): complete stillness — pad the timeline to 4.5s.
        tl.to({}, { duration: 0.01 }, 4.49);

        window.__timelines = window.__timelines || {};
        window.__timelines["06-outro"] = tl;
      })();
