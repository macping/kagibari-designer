<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
      @font-face {
        font-family: "Yu Mincho";
        font-weight: 500;
        src: local("Yu Mincho Demibold"), local("YuMincho-Demibold"),
          local("Yu Mincho"), local("YuMincho");
      }
      @font-face {
        font-family: "Yu Gothic UI";
        font-weight: 500;
        src: local("Yu Gothic UI Semibold"), local("Yu Gothic UI"),
          local("YuGothicUI");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 500;
        src: local("JetBrains Mono Medium"), local("JetBrains Mono"),
          local("JetBrainsMono-Medium"), local("Consolas");
      }

    /* ---- 05-value · Editorial Forest · value stack on green gravity ground ---- */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "Yu Gothic UI", sans-serif;
      color: #FDFAF4;
    }
    .clip {
      position: absolute;
      inset: 0;
    }
    /* full-bleed ground lives on a clip layer, never on #root */
    .yv05-ground {
      background: #00695C;
    }

    /* -- topbar (chrome spine) -- */
    .yv05-topbar {
      position: absolute;
      top: 46px;
      left: 96px;
      right: 96px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 24px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ADC7C0;
    }

    /* -- centered column, ~55% width -- */
    .yv05-col {
      position: absolute;
      top: 170px;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: 1064px;
    }

    /* mono label, type-on with caret */
    .yv05-labelwrap {
      position: relative;
      display: inline-block;
      margin-bottom: 46px;
    }
    .yv05-label {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ADC7C0;
      white-space: nowrap;
    }
    .yv05-caret {
      position: absolute;
      left: 0;
      top: -3px;
      width: 3px;
      height: 36px;
      background: #ADC7C0;
      opacity: 0;
    }

    /* -- value rows -- */
    .yv05-rows {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .yv05-row {
      display: flex;
      align-items: center;
      gap: 30px;
    }
    .yv05-check {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
    }
    .yv05-check path {
      fill: none;
      stroke: #C96F4A;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .yv05-rowtext {
      display: inline-block;
      font-family: Georgia, "Yu Mincho", serif;
      font-weight: 500;
      font-size: 4.2cqw;
      line-height: 1.0;
      letter-spacing: -0.01em;
      color: #FDFAF4;
    }

    /* -- divider + Pro line -- */
    .yv05-divider {
      width: 100%;
      height: 2px;
      background: #C96F4A;
      margin-top: 40px;
    }
    .yv05-pro {
      margin-top: 34px;
      display: flex;
      flex-wrap: nowrap;
      white-space: nowrap;
      align-items: baseline;
      font-family: Georgia, "Yu Mincho", serif;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .yv05-proseg {
      display: inline-block;
      font-size: 2.4cqw;
      color: #FDFAF4;
    }
    .yv05-proseg.is-price {
      color: #C96F4A;
      margin-left: 0.16em;
    }
    .yv05-proseg.is-dash {
      color: #ADC7C0;
      margin: 0 0.4em;
    }
    .yv05-proseg.is-feature {
      font-size: 1.6cqw;
      color: #ADC7C0;
      letter-spacing: 0;
    }
  </style>

  <div id="root" data-composition-id="05-value" data-width="1920" data-height="1080" data-duration="5.9">
    <!-- full-bleed ground: lowest track, full duration -->
    <div class="clip yv05-ground" data-start="0" data-duration="5.9" data-track-index="0"></div>

    <!-- stage -->
    <div class="clip" id="yv05-stage" data-start="0" data-duration="5.9" data-track-index="1">
      <div class="yv05-topbar" id="yv05-topbar">
        <span id="yv05-topbar-left"></span>
        <span id="yv05-topbar-right"></span>
      </div>

      <div class="yv05-col" id="yv05-col">
        <div class="yv05-labelwrap">
          <span class="yv05-label" id="yv05-label"></span>
          <span class="yv05-caret" id="yv05-caret"></span>
        </div>

        <div class="yv05-rows" id="yv05-rows"></div>

        <div class="yv05-divider" id="yv05-divider"></div>

        <div class="yv05-pro" id="yv05-pro"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      /* Every visible on-screen string lives here (en/zh re-render swaps this object). */
      const STRINGS = {
        topbarLeft: "KAGIBARI — CROCHET CHART",
        topbarRight: "05",
        monoLabel: "OFFLINE · NO ADS",
        values: ["完全离线", "编织图只在设备里", "无需账号", "不上传任何数据"],
        proSegments: [
          { t: "无广告（买断 ", kind: "lead" },
          { t: "¥800", kind: "price" },
          { t: "）", kind: "lead" },
          { t: "—", kind: "dash" },
          { t: "非订阅 · ", kind: "feature" },
          { t: "环形不限段数 · ", kind: "feature" },
          { t: "全部32种记号", kind: "feature" },
        ],
      };

      /* ---- inject strings into the DOM ---- */
      document.getElementById("yv05-topbar-left").textContent = STRINGS.topbarLeft;
      document.getElementById("yv05-topbar-right").textContent = STRINGS.topbarRight;

      const labelEl = document.getElementById("yv05-label");
      labelEl.textContent = STRINGS.monoLabel;

      const rowsEl = document.getElementById("yv05-rows");
      const rowEls = [];
      const checkPaths = [];
      const rowTexts = [];
      const SVG_NS = "http://www.w3.org/2000/svg";
      STRINGS.values.forEach(function (val, i) {
        const row = document.createElement("div");
        row.className = "yv05-row";
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("class", "yv05-check");
        svg.setAttribute("viewBox", "0 0 44 44");
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", "M9 23.5 L18.5 33 L35 12.5");
        svg.appendChild(path);
        const txt = document.createElement("span");
        txt.className = "yv05-rowtext";
        txt.textContent = val;
        row.appendChild(svg);
        row.appendChild(txt);
        rowsEl.appendChild(row);
        rowEls.push(row);
        checkPaths.push(path);
        rowTexts.push(txt);
      });

      const proEl = document.getElementById("yv05-pro");
      const proSegs = [];
      STRINGS.proSegments.forEach(function (seg) {
        const span = document.createElement("span");
        span.className =
          "yv05-proseg" +
          (seg.kind === "price" ? " is-price" : "") +
          (seg.kind === "dash" ? " is-dash" : "") +
          (seg.kind === "feature" ? " is-feature" : "");
        span.textContent = seg.t;
        proEl.appendChild(span);
        proSegs.push(span);
      });

      /* ---- svg-path-draw setup: measure real geometry ---- */
      checkPaths.forEach(function (p) {
        const len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      /* ---- timeline ---- */
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["05-value"] = tl;

      /* Scene 1 (0.0–0.8s): topbar + mono label type-on with caret */
      tl.fromTo(
        "#yv05-topbar",
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        0,
      );

      const CH = STRINGS.monoLabel.length;
      const labelW = labelEl.getBoundingClientRect().width;
      const stepEase = "steps(" + CH + ")";
      tl.fromTo(
        labelEl,
        { clipPath: "inset(-8% 100.4% -8% -0.4%)" },
        { clipPath: "inset(-8% -0.4% -8% -0.4%)", duration: 0.65, ease: stepEase },
        0.06,
      );
      const caret = document.getElementById("yv05-caret");
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, 0.02);
      tl.fromTo(caret, { x: 2 }, { x: labelW + 4, duration: 0.65, ease: stepEase }, 0.06);
      /* finite deterministic blink, then the caret retires */
      tl.set(caret, { opacity: 0 }, 0.95);
      tl.set(caret, { opacity: 1 }, 1.2);
      tl.set(caret, { opacity: 0 }, 1.45);
      tl.set(caret, { opacity: 1 }, 1.7);
      tl.to(caret, { opacity: 0, duration: 0.25, ease: "power1.out" }, 1.95);

      /* Scene 2 (0.8–3.2s): staggered cascade assemble — fade + short slide into slot,
         check self-draws first, text follows */
      rowEls.forEach(function (row, i) {
        const t = 0.8 + i * 0.6;
        tl.fromTo(
          row,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          t,
        );
        tl.to(
          checkPaths[i],
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
          t + 0.08,
        );
        tl.fromTo(
          rowTexts[i],
          { opacity: 0, x: -16 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
          t + 0.24,
        );
      });

      /* Scene 3 (3.2–4.6s): divider wipes left→right (scaleX fill), Pro line per-word reveal */
      tl.fromTo(
        "#yv05-divider",
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.45, ease: "power2.out" },
        3.25,
      );
      tl.fromTo(
        proSegs,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", stagger: 0.08 },
        3.5,
      );

      /* Scene 4 (4.6–5.5s): hold with subtle jitter only — sine phase proxy with
         settle envelope; lands at zero offset (no exit) */
      const col = document.getElementById("yv05-col");
      const CYCLES = 0.5;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: 0.9,
          ease: "none",
          onUpdate: function () {
            const prog = phase.p / (Math.PI * 2 * CYCLES);
            const env = prog < 0.7 ? 1 : (1 - prog) / 0.3;
            col.style.transform =
              "translateY(" + (Math.sin(phase.p) * 2 * env).toFixed(3) + "px)";
          },
        },
        4.6,
      );
    })();
  </script>
</template>
