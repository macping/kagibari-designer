<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- feature graphic 1024×500。用法: feature.html?lang=ja -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #004A40 0%, #00695C 58%, #2E8578 100%);
    font-family: 'Noto Sans JP', sans-serif; color: #FDFAF4;
    display: flex; align-items: center;
  }
  .left { flex: 1; padding: 0 0 0 64px; }
  .spine { font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: .32em; opacity: .75; margin-bottom: 20px; }
  h1 { font-family: 'Noto Serif JP', serif; font-weight: 700; font-size: 54px; line-height: 1.25; white-space: pre-line; }
  .sub { font-size: 22px; margin-top: 18px; opacity: .92; white-space: pre-line; line-height: 1.5; }
  .badges { margin-top: 24px; display: flex; gap: 12px; }
  .badge { font-size: 18px; font-weight: 700; border: 1.5px solid rgba(253,250,244,.6); border-radius: 999px; padding: 7px 18px; }
  .badge.accent { background: #C96F4A; border-color: #C96F4A; }
  .right { flex: 0 0 420px; height: 100%; display: flex; align-items: center; justify-content: center; }
  .paper {
    width: 356px; height: 356px; background: #FDFAF4; border-radius: 28px;
    box-shadow: 0 22px 54px rgba(0,0,0,.32); transform: rotate(4deg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .paper img { width: 322px; }
</style>
</head>
<body>
<div class="left">
  <div class="spine">KAGIBARI — CROCHET CHART</div>
  <h1 id="t"></h1>
  <div class="sub" id="s"></div>
  <div class="badges" id="b"></div>
</div>
<div class="right"><div class="paper"><img src="round.png"></div></div>
<script>
const lang = new URLSearchParams(location.search).get('lang') || 'ja';
const T = {
  ja: { t: '編み図デザイナー', s: 'かぎ針編みの編み図を、指先でデザイン。\n円編み・方眼、段ごとの目数も正確に。', b: ['広告なし', '完全オフライン', '買い切り¥800'] },
  en: { t: 'Crochet Chart\nDesigner', s: 'Design crochet charts on your phone.\nRound & filet grids, true stitch counts.', b: ['No ads', 'Fully offline', 'One-time ¥800'] },
  zh: { t: '钩针编织图设计', s: '在手机上绘制钩针编织图。\n环形与方格，每段针数精确设定。', b: ['无广告', '完全离线', '买断制¥800'] },
}[lang];
document.getElementById('t').textContent = T.t;
document.getElementById('s').textContent = T.s;
document.getElementById('b').innerHTML = T.b.map((x, i) => `<span class="badge${i === 2 ? ' accent' : ''}">${x}</span>`).join('');
</script>
</body>
</html>
