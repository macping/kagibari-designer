# 宿主は多セッション並走で物理メモリ逼迫——Xmx8G は native OOM で JVM ごと
# 落ちた実績あり（2026-11-02 hs_err: G1 virtual space mmap 失敗）。3G で十分。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# pubキャッシュ(C:)とプロジェクト(D:)のドライブが異なると
# Kotlinインクリメンタルコンパイルが "different roots" で失敗するため無効化
kotlin.incremental=false
# 宿主の「構建完了後に gradlew --stop」新規（2026-11-01）は全セッション共有の
# daemon を落とすため、並走中の他プロジェクトのビルドが
# "daemon has been stopped: stop command received" で道連れになる（当日3回実測）。
# daemon 不使用ならこの停止に免疫＋アイドル常駐メモリもゼロ（新規の趣旨にも合致）。
org.gradle.daemon=false
